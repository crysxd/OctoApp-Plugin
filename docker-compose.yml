version: '2'
services:
  octoapp-plugin:
    image: ghcr.io/crysxd/octoapp-plugin:latest
    environment:
        # Required: The mode of OctoApp Companion Plugin you want use.
        #   - bambu:      Bambu Companion Plugin - for Bambu Lab 3D printers such as the Bambu Lab A1, P1, and X1 series.
        #   - elegoo:     Elegoo Companion Plugin - for Elegoo OS 3D printers such as the Elegoo Centauri & Elegoo Centauri Carbon.
        #   - elegoo_cc2: Elegoo CC2 Companion Plugin - for Elegoo Centauri Carbon 2 printers (skips CC1 network scan).
        #   - klipper:    Use this for Klipper / Moonraker based printers.
        #
        # Set this to the mode you want to use, and then uncomment the required settings for the mode bellow.
        - COMPANION_MODE=bambu

        #
        # Required for Bambu Connect
        #
        #  https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-for-BambuLab#finding-your-access-code
        #- ACCESS_CODE=5285c831
        #
        #  https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-for-BambuLab#finding-your-serial-number
        #- SERIAL_NUMBER=00M09C411200608
        #
        #  Find using the printer's display or use https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-for-BambuLab#finding-your-bambu-lab-printers-ip-address
        #- PRINTER_IP=10.0.0.23


        #
        # Required for Elegoo Connect (Centauri / Centauri 2)
        #
        #  Find using the printer's display or use https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-on-Elegoo-Centauri#finding-your-elegoos-ip-address
        #- PRINTER_IP=XXX.XXX.XXX.XXX
        #
        #  Required for Centauri 2 only - the LAN-only access code shown on the printer's touch screen under Settings > LAN Only.
        #  If the access code is disabled on your printer, use the default value of '123456'.
        #- ACCESS_CODE=123456
        #
        #  Optional for Centauri 2 only - the printer's serial number. Auto-detected on first run if not set.
        #- SERIAL_NUMBER=XXXXXXXXXXXXXXX


        #
        # Required For Klipper / Moonraker
        #
        #  Required - The IP address of the Klipper/Moonraker/Webserver/Printer
        #- PRINTER_IP=XXX.XXX.XXX.XXX
        #
        #  Optional - The port of Moonraker. This defaults to 7125 if not set.
        #- MOONRAKER_PORT=7125
        #
        #  Optional - If your Moonraker needs API key auth, you can generate it in Mainsail or Fluidd and set it here.
        #- MOONRAKER_API_KEY=someApiKey
        #
        #  Optional - The port of frontend webserver. This defaults to 80 if not set.
        #- WEBSERVER_PORT=80

        #
        # Optional Settings For All Modes
        #
        # Set timezone to proper timezone for logs using standard timezones:
        # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
        - TZ=America/New_York

    volumes:
      # This can also be an absolute path, e.g. /var/octoapp/plugin/data or /c/users/name/plugin/data
      - ./data:/data




  #
  # Add as many printers and printer types as you want!
  #
  # octoapp-plugin-2:
  #   image: ghcr.io/crysxd/octoapp-plugin:latest
  #   environment:
  #       # Required: The mode of OctoApp Companion Plugin you want use.
  #       #   - bambu:      Bambu Companion Plugin - for Bambu Lab 3D printers such as the Bambu Lab A1, P1, and X1 series.
  #       #   - elegoo:     Elegoo Companion Plugin - for Elegoo OS 3D printers such as the Elegoo Centauri & Elegoo Centauri Carbon.
  #       #   - elegoo_cc2: Elegoo CC2 Companion Plugin - for Elegoo Centauri Carbon 2 printers (skips CC1 network scan).
  #       #   - klipper:    Use this for Klipper / Moonraker based printers.
  #       #
  #       # Set this to the mode you want to use, and then uncomment the required settings for the mode bellow.
  #       - COMPANION_MODE=bambu

  #       #
  #       # Required for Bambu Connect
  #       #
  #       # https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-for-BambuLab#finding-your-access-code
  #       #- ACCESS_CODE=5285c831
  #       #
  #       #  https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-for-BambuLab#finding-your-serial-number
  #       #- SERIAL_NUMBER=00M09C411200608
  #       #
  #       #  Find using the printer's display or use https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-for-BambuLab#finding-your-bambu-lab-printers-ip-address
  #       #- PRINTER_IP=10.0.0.23


        #
        # Required for Elegoo Connect (Centauri / Centauri 2)
        #
        #  Find using the printer's display or use https://github.com/crysxd/OctoApp-Plugin/wiki/Installation-on-Elegoo-Centauri#finding-your-elegoos-ip-address
        #- PRINTER_IP=XXX.XXX.XXX.XXX
        #
        #  Required for Centauri 2 only - the LAN-only access code shown on the printer's touch screen under Settings > LAN Only.
        #  If the access code is disabled on your printer, use the default value of '123456'.
        #- ACCESS_CODE=123456
        #
        #  Optional for Centauri 2 only - the printer's serial number. Auto-detected on first run if not set.
        #- SERIAL_NUMBER=XXXXXXXXXXXXXXX


  #       #
  #       # Required For Klipper / Moonraker
  #       #
  #       #  Required - The IP address of the Klipper/Moonraker/Webserver/Printer
  #       #- PRINTER_IP=XXX.XXX.XXX.XXX
  #       #
  #       #  Optional - The port of Moonraker. This defaults to 7125 if not set.
  #       #- MOONRAKER_PORT=7125
  #       #
  #       #  Optional - If your Moonraker needs API key auth, you can generate it in Mainsail or Fluidd and set it here.
  #       #- MOONRAKER_API_KEY=someApiKey
  #       #
  #       #  Optional - The port of frontend webserver. This defaults to 80 if not set.
  #       #- WEBSERVER_PORT=80

  #       #
  #       # Optional Settings For All Modes
  #       #
  #       # Set timezone to proper timezone for logs using standard timezones:
  #       # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
  #       - TZ=America/New_York

  #   volumes:
  #     # This can also be an absolute path, e.g. /var/octoapp/plugin/data or /c/users/name/plugin/data
  #     - ./data:/data